# --- Reload ---
unbind r
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

# --- Prefix ---
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# --- Options ---
set -g mouse on
set-option -g status-position top
set -g status-interval 1

# --- Movement bindings ---
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# --- Splits ---
bind ] split-window -h -c "#{pane_current_path}"
bind [ split-window -v -c "#{pane_current_path}"


# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'not-diba/tmux-daily-affirmations'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# --- Melangey clean tmux theme ---
melange_bg='#292522'
melange_bg_light='#34302C'
melange_fg='#C1A78E'
melange_yellow='#EBC06D'
melange_cyan='#89B3B6'
melange_comment='#867462'
melange_blue='#A3A9CE'
melange_magenta='#CF9BC2'
melange_red='#D47766'

set -g status-style "bg=$melange_bg,fg=$melange_fg"
set -g window-status-separator ""

left_sep='◥'
right_sep='◣'

# Session name (left side, spaced) - changes color when prefix is pressed
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[bg=$melange_red#,fg=$melange_bg#,bold],#[bg=$melange_cyan#,fg=$melange_bg#,bold]} #S #{?client_prefix,#[bg=$melange_bg#,fg=$melange_red],#[bg=$melange_bg#,fg=$melange_cyan]}$right_sep"

# Inactive windows (angled tabs)
set -g window-status-format "#[fg=$melange_bg_light,bg=$melange_bg]$left_sep#[fg=$melange_fg,bg=$melange_bg_light] #I:#W #[fg=$melange_bg_light,bg=$melange_bg]$right_sep"

# Active window (angled tabs, highlighted)
set -g window-status-current-format "#[fg=$melange_yellow,bg=$melange_bg]$left_sep#[fg=$melange_bg,bg=$melange_yellow,bold] #I:#W #[fg=$melange_yellow,bg=$melange_bg]$right_sep"

# Pane border styling
set -g pane-border-style "fg=$melange_comment"
set -g pane-active-border-style "fg=$melange_cyan"

# Message styling
set -g message-style "bg=$melange_yellow,fg=$melange_bg,bold"
set -g message-command-style "bg=$melange_magenta,fg=$melange_bg,bold"

# Mode styling
set -g mode-style "bg=$melange_blue,fg=$melange_bg,bold"

# Extra redraws so the affirmation marquee scrolls smoothly (status-interval
# can't go below 1s, which is too coarse for a per-character scroll)
# run -b "bash ~/Documents/code/dotfiles/tmux-smooth-refresh.sh"

# --- Status line customization ---
set -g status-right-length 100

# Mirrored angled tabs for the right side (flipped vs. the window tabs)
right_left_sep='◢'
right_right_sep='◤'

set -g status-right ""
set -ag status-right "#[fg=$melange_cyan,bg=$melange_bg]$right_left_sep#[fg=$melange_bg,bg=$melange_cyan,bold]  #{cpu_percentage} #[fg=$melange_cyan,bg=$melange_bg]$right_right_sep"
set -ag status-right "#[fg=$melange_yellow,bg=$melange_bg]$right_left_sep#[fg=$melange_bg,bg=$melange_yellow,bold] 󰔟 #(uptime | sed -E 's/^[^,]*up *//; s/, *[0-9]+ users?,.*//; s/, *load average.*//I; s/,  +/, /; s/^([0-9]+) days?, ([0-9]{1,2}):([0-9]{1,2})$/\\1d \\2h \\3m/; s/^([0-9]{1,2}):([0-9]{1,2})$/\\1h \\2m/; s/^([0-9]+) mins?$/\\1m/')     "
# set -ag status-right "#[fg=$melange_magenta,bg=$melange_bg]$right_left_sep#[fg=$melange_bg,bg=$melange_magenta,bold,italics]  #(bash ~/.tmux/plugins/tmux-daily-affirmations/scripts/daily_affirmations_scroll.sh) "

# --- Initialize TPM (MUST be last) ---
run '~/.tmux/plugins/tpm/tpm'
